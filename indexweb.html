<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Desktop Atelier</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial;
    background:#faf4ff;
}

.container{
    width:90vw;
    max-width:90vw;
    margin:auto;
}

/* HEADER */

header{
    background:white;
    padding:3vh 0;
    border-bottom:0.1vh solid #ddd;
}

.header-content{
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logo{
    font-size:2vw;
    font-weight:bold;
    color:#4a40e0;
}

.menu{
    display:flex;
    gap:3vw;
}

.menu a{
    text-decoration:none;
    color:#333;
    font-weight:bold;
    font-size:1vw;
}

/* HERO */

.hero{
    padding:10vh 0;
}

.hero-content{
    display:flex;
    align-items:center;
    gap:5vw;
}

.hero-text{
    width:50%;
}

.hero-text h1{
    font-size:5vw;
    margin-bottom:2vh;
}

.hero-text p{
    font-size:1.3vw;
    line-height:1.8;
    margin-bottom:3vh;
}

.hero-image{
    width:50%;
}

.hero-image img{
    width:100%;
    border-radius:2vw;
}

.btn{
    padding:2vh 3vw;
    border:none;
    border-radius:5vw;
    font-size:1vw;
    font-weight:bold;
    cursor:pointer;
}

.primary{
    background:#4a40e0;
    color:white;
}

/* PRODUCTS */

.products{
    padding:10vh 0;
}

.grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:2vw;
}

.card{
    background:white;
    border-radius:2vw;
    overflow:hidden;
}

.card img{
    width:100%;
    height:35vh;
    object-fit:cover;
}

.info{
    padding:2vh 1.5vw;
}

.info h3{
    font-size:1.2vw;
}

.price{
    color:#4a40e0;
    font-weight:bold;
    margin-top:1vh;
    font-size:1vw;
}

/* RESPONSIVO */

@media(max-width:1024px){

    .hero-content{
        flex-direction:column;
    }

    .hero-text,
    .hero-image{
        width:100%;
    }

    .logo{
        font-size:4vw;
    }

    .menu a{
        font-size:2vw;
    }

    .hero-text h1{
        font-size:8vw;
    }

    .hero-text p{
        font-size:2.5vw;
    }

    .btn{
        font-size:2vw;
    }

    .grid{
        grid-template-columns:repeat(2,1fr);
    }

    .info h3{
        font-size:2.5vw;
    }

    .price{
        font-size:2vw;
    }
}

@media(max-width:600px){

    .menu{
        display:none;
    }

    .hero{
        padding:6vh 0;
    }

    .hero-text h1{
        font-size:10vw;
    }

    .hero-text p{
        font-size:4vw;
    }

    .btn{
        width:100%;
        font-size:4vw;
        padding:2vh 0;
    }

    .grid{
        grid-template-columns:1fr;
    }

    .card img{
        height:30vh;
    }

    .info h3{
        font-size:5vw;
    }

    .price{
        font-size:4vw;
    }

    .logo{
        font-size:6vw;
    }
}

</style>
</head>

<body>

<header>
    <div class="container header-content">

        <div class="logo">
            The Digital Atelier
        </div>

        <nav class="menu">
            <a href="#">Home</a>
            <a href="#">Shop</a>
            <a href="#">Contato</a>
        </nav>

    </div>
</header>

<section class="hero">

    <div class="container hero-content">

        <div class="hero-text">

            <h1>Curated Artistry</h1>

            <p>
                Coleções modernas e exclusivas para pessoas sofisticadas.
            </p>

            <button class="btn primary">
                Shop Now
            </button>

        </div>

        <div class="hero-image">
            <img src="https://images.unsplash.com/photo-1505693416388-ac5ce068fe85?q=80&w=1200">
        </div>

    </div>

</section>

<section class="products">

    <div class="container">

        <div class="grid">

            <div class="card">
                <img src="https://images.unsplash.com/photo-1545239351-1141bd82e8a6?q=80&w=1200">
                <div class="info">
                    <h3>Indigo Series</h3>
                    <div class="price">$245</div>
                </div>
            </div>

            <div class="card">
                <img src="https://images.unsplash.com/photo-1517705008128-361805f42e86?q=80&w=1200">
                <div class="info">
                    <h3>Tidal Vessel</h3>
                    <div class="price">$120</div>
                </div>
            </div>

            <div class="card">
                <img src="https://images.unsplash.com/photo-1523170335258-f5ed11844a49?q=80&w=1200">
                <div class="info">
                    <h3>Chrono Silver</h3>
                    <div class="price">$380</div>
                </div>
            </div>

            <div class="card">
                <img src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e?q=80&w=1200">
                <div class="info">
                    <h3>Sonic Bloom</h3>
                    <div class="price">$450</div>
                </div>
            </div>

        </div>

    </div>

</section>

</body>
</html>
